name: Daily post

on:
  schedule:
    # 05:07 UTC — Instagram engagement peaks in the morning; the odd minute
    # avoids GitHub's on-the-hour queue, which can delay runs by 10+ minutes.
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be posted, post nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python publish.py

      - name: Commit queue position
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet state.json; then
            echo "state unchanged"; exit 0
          fi
          git config user.name "quiet-operator-bot"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "posted card $(python -c "import json;print(json.load(open('state.json'))['next_index']-1)")"
          git push
